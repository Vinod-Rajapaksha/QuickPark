name: Backend CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  backend-ci:
    name: Build and Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore backend/QuickPark.sln

      - name: Build backend
        run: dotnet build backend/QuickPark.sln --no-restore --configuration Release

      - name: Run backend tests
        run: dotnet test backend/QuickPark.sln --no-build --configuration Release
